name: Automated Jira Sankey Sync

on:
  schedule:
    # Runs automatically every single day at 8:00 AM UTC (4:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Adds a manual "Run workflow" button on GitHub so you can trigger it instantly anytime

permissions:
  contents: write # Gives the cloud runner permission to commit the HTML file to your repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Jira Data Pipeline
      env:
        # This securely injects your hidden GitHub Secrets into Python's environment variables
        JIRA_URL: ${{ secrets.JIRA_URL }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        JIRA_FILTER_ID: ${{ secrets.JIRA_FILTER_ID }}
      run: python jira_download.py

    - name: Host HTML to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        keep_files: true
