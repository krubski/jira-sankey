name: Automated Jira Sankey Sync

on:
  schedule:
    # Backup passive sync at an off-peak minute
    - cron: '42 * * * *'
  workflow_dispatch: # Adds the manual "Run workflow" button on GitHub
  repository_dispatch:
    types: [jira_update] # 🌟 This tells GitHub to instantly run when Jira sends a webhook

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas python-dotenv

    - name: Clean Old Web Assets
      run: rm -f index.html application_sankey.html

    - name: Run Jira Data Pipeline
      env:
        JIRA_URL: ${{ secrets.JIRA_URL }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        JIRA_FILTER_ID: ${{ secrets.JIRA_FILTER_ID }}
      run: python -u jira_download.py

    - name: Prepare Web Asset
      run: |
        if [ -f "application_sankey.html" ]; then
          mv application_sankey.html index.html
          echo "✅ Successfully mapped pipeline output to index.html"
        else
          echo "❌ Critical Error: Script exited but application_sankey.html was not found!"
          exit 1
        fi

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4